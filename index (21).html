 if(v=='tasks')h=`<h2>Telegram tasks</h2>`+tasks('tg');
 if(v=='earn')h=`<h2>Sponsor tasks</h2>`+tasks('sp');
 if(v=='act'){h=hero('Activate account','Pay once to unlock tasks and withdrawals.')+`<div class="sheet">`+(u.act==2?`<div class="card"><h3>✅ Account activated</h3><p class="mu">You can now earn and withdraw.</p></div>`:`<div class="card dk"><span class="mu">Activation fee</span><div class="big">${N(C.act_fee)}</div><p class="mu">Transfer exactly this amount to the account below:</p><div class="kv"><span class="mu">Bank</span><b>${ACC.bank}</b></div><div class="kv"><span class="mu">Account number</span><b style="font-size:20px;letter-spacing:1px">${ACC.no}</b><button class="cp" data-a="copy" data-i="${ACC.no}">Copy</button></div><div class="kv"><span class="mu">Account name</span><b>${ACC.name}</b></div></div>`+(u.act==1?`<div class="card"><span class="tag">Pending</span> Your payment screenshot is waiting for admin approval.</div>`:`<div class="card"><h3>Send payment proof</h3><p class="mu">After paying, upload your payment screenshot.</p><input type="file" accept="image/*" data-a="pic"><div id="pv" class="mu"></div><button class="p" data-a="sendproof">Send proof for approval</button></div>`))+`</div>`}
 if(v=='refer')h=hero('Refer &amp; Earn',`Earn ${N(C.ref)} when a friend you invite activates.`)+`<div class="sheet"><div class="card"><span class="mu">Your invite link</span><h3 style="word-break:break-all">https://t.me/wstaskpay_bot?start=${u.id}</h3><button class="p" data-a="copy" data-i="https://t.me/wstaskpay_bot?start=${u.id}">Copy invite link</button></div><div class="row"><div class="st">Invited<b>${D.invited}</b></div><div class="st">Activated<b>${D.qualified}</b></div><div class="st">Earned<b>${N(D.qualified*C.ref)}</b></div></div><h3 style="margin:14px 0 8px">Your referrals</h3>`+(D.refs.map(x=>`<div class="card rf"><b>${esc(x.name)}</b>${x.act==2?`<span class="tag a">Activated · +${N(C.ref)}</span>`:'<span class="tag">Pending</span>'}</div>`).join('')||'<p class="mu">No referrals yet. Share your link!</p>')+`</div>`;
 if(v=='wallet'){h=`<h2>Wallet</h2><div class="bal"><span>Available balance</span><b>${N(u.bal)}</b></div><div class="seg"><button class="${w=='w'?'on':''}" data-a="wt" data-i="w">Withdraw</button><button class="${w=='h'?'on':''}" data-a="wt" data-i="h">History</button></div>`;
  if(w=='w')h+=(u.acct_no?`<div class="card"><span class="mu">Payout wallet</span><h3>${esc(u.bank)} ••${last4(u.acct_no)}</h3>${esc(u.acct_name)}<br><button class="s" style="margin-top:8px" data-a="go" data-i="setwallet">Change wallet</button></div><div class="card"><p class="mu">Fee ${C.fee_pct}% · Minimum ${N(C.min)}</p><input id="wa" inputmode="numeric" placeholder="Amount to withdraw"><button class="p" data-a="wd">Request withdrawal</button></div>`:`<div class="card"><h3>Add your bank account</h3><p class="mu">Set the wallet where your money will be paid.</p><button class="p" data-a="go" data-i="setwallet">Set wallet</button></div>`);
  else h+=D.wds.map(x=>`<div class="card" style="cursor:pointer" data-a="wdv" data-i="${x.id}"><span class="amt">${N(x.amt-x.fee)}</span>${esc(x.bank)} ••${last4(x.no)}<br><span class="mu">${new Date(x.created).toLocaleString()} · fee ${N(x.fee)}</span><br><span class="mu">${x.ref}</span><br>${tag(x.s)}</div>`).join('')||'<p class="mu">No withdrawals yet.</p>'}
 if(v=='wdone'&&sw){const x=sw,st=x.s=='a'?'Withdrawal approved':x.s=='r'?'Withdrawal rejected':'Withdrawal requested';h=`<div style="text-align:center"><button class="s" data-a="go" data-i="wallet" style="float:left">‹ Back</button><div style="clear:both;padding-top:6px">${IL}</div><h2 style="margin:6px 0 4px">${st}</h2><div class="big">${N(x.amt-x.fee)}</div><p class="mu">To ${esc(x.bank)} ••${last4(x.no)} · ${esc(x.name)}</p></div><div class="card"><div class="kv"><span class="mu">Reference</span><b style="font-family:monospace;font-size:13px">${x.ref}</b></div><div class="kv"><span class="mu">Amount</span><b>${N(x.amt)}</b></div><div class="kv"><span class="mu">Fee</span><b>${N(x.fee)}</b></div><div class="kv"><span class="mu">Date</span><b>${new Date(x.created).toLocaleString()}</b></div><div class="kv"><span class="mu">Status</span>${tag(x.s)}</div></div>${x.s=='r'?'<p class="mu" style="text-align:center">The amount was returned to your balance.</p>':''}`}
 if(v=='setwallet')h=hero('Set wallet','Add the bank account where your money will be paid.','wallet')+`<div class="sheet"><div class="card"><span class="mu">Bank</span><div class="sel" data-a="banks"><span>${sb?esc(sb[0]):'Select bank'}</span><span>⌄</span></div><span class="mu">Account number</span><input id="an" inputmode="numeric" maxlength="10" placeholder="10-digit account number" value="${esc(san)}"><div class="ns" id="ns">${swn&&!nl?'<div class="ok">✓ '+esc(swn)+'</div>':''}</div><input id="wn" placeholder="Account name" value="${esc(swn)}"><button class="p" data-a="savew">Save wallet</button></div><p class="mu" style="text-align:center">Use an account in your own name.</p></div>`;
 A.innerHTML=h+(mo?`<div class="modal"><div class="mb"><div class="mh"><b>Select bank</b><button data-a="closeb">✕</button></div><input id="bq" placeholder="Search bank" value="${esc(bq)}"><div id="bl">${bankList()}</div></div></div>`:'');
 nav.innerHTML=`<div>`+[['home','Home'],['tasks','Tasks'],['earn','Earn','mid'],['refer','Invite'],['wallet','Wallet']].map(x=>`<button class="${x[2]||''} ${(v=='wdone'?'wallet':v)==x[0]?'on':''}" data-a="go" data-i="${x[0]}">${x[2]?'<span><i>WS</i></span>':IC[x[0]]}${x[1]}</button>`).join('')+`</div>`;
}
function admin(A){
 const T=[['users','Users'],['pay','Payments'],['tasks','Tasks'],['wds','Withdrawals'],['subs','Proofs'],['cfg','Settings']],C=D.cfg;
 let h=`<div class="top"><span>Admin</span><button data-a="exit">✕</button></div><div class="tabs">`+T.map(t=>`<button class="s ${at==t[0]?'on':''}" data-a="at" data-i="${t[0]}">${t[1]}</button>`).join('')+`</div>`;
 if(at=='users')h+=AD.map(x=>`<div class="card"><h3>${esc(x.name)} <span class="mu">${x.id}</span></h3><p class="mu">Balance ${N(x.bal)} · ${x.act==2?'Active':x.act==1?'Payment pending':'Not activated'}</p>`+(x.act!=2?`<button class="s" data-a="act" data-i="${x.id}">Activate</button>`:'')+`<input id="m${x.id}" inputmode="numeric" placeholder="Amount to add (negative to deduct)"><button class="p" data-a="add" data-i="${x.id}">Add money</button></div>`).join('')||'<p class="mu">No users yet.</p>';
 if(at=='pay')h+=AD.map(x=>`<div class="card"><h3>${esc(x.name)} <span class="mu">${x.id}</span></h3><p class="mu">Activation payment proof</p>${x.proof?`<img class="pf" src="${x.proof}">`:'<p class="mu">No screenshot</p>'}<div class="row" style="margin-top:8px"><button class="s" data-a="act" data-i="${x.id}">Approve</button><button class="s d" data-a="prej" data-i="${x.id}">Reject</button></div></div>`).join('')||'<p class="mu">No pending payments.</p>';
 if(at=='tasks')h+=`<div class="card"><h3>Add task</h3><select id="tt"><option value="tg">Telegram task (Tasks tab)</option><option value="sp">Sponsor task (Earn tab)</option></select><input id="tl" placeholder="Title"><input id="tk" placeholder="Public channel link, e.g. https://t.me/yourchannel"><textarea id="tw" placeholder="Write-up (sponsor task)"></textarea><input type="file" accept="image/*" data-a="pic"><input id="ta" inputmode="numeric" placeholder="Reward amount"><button class="p" data-a="addt">Add task</button></div>`+D.tasks.map(t=>`<div class="card"><span class="amt">${N(t.amt)}</span><h3>${esc(t.title)}</h3><span class="mu">${t.type=='tg'?'Telegram':'Sponsor'}</span><br><button class="s d" data-a="delt" data-i="${t.id}">Delete</button></div>`).join('');
 if(at=='wds')h+=AD.map(x=>`<div class="card"><span class="amt">${N(x.amt)}</span>${esc(x.users&&x.users.name)}<br>${esc(x.bank)} · ${esc(x.no)} · ${esc(x.name)}<br><span class="mu">${x.ref} · fee ${N(x.fee)} · pay ${N(x.amt-x.fee)}</span><br>${tag(x.s)}`+(x.s=='p'?`<div class="row" style="margin-top:8px"><button class="s" data-a="wa" data-i="${x.id}">Approve</button><button class="s d" data-a="wr" data-i="${x.id}">Reject</button></div>`:'')+`</div>`).join('')||'<p class="mu">No withdrawals.</p>';
 if(at=='subs')h+=AD.map(s=>`<div class="card"><span class="amt">${N(s.tasks&&s.tasks.amt)}</span><h3>${esc(s.tasks&&s.tasks.title)}</h3>${esc(s.users&&s.users.name)}${s.img?`<img class="pf" src="${s.img}">`:''}<br>${tag(s.s)}`+(s.s=='p'?`<div class="row" style="margin-top:8px"><button class="s" data-a="sa" data-i="${s.id}">Approve</button><button class="s d" data-a="sr" data-i="${s.id}">Reject</button></div>`:'')+`</div>`).join('')||'<p class="mu">No submissions.</p>';
 if(at=='cfg')h+=`<div class="card"><h3>Settings</h3><p class="mu">Activation fee</p><input id="s1" value="${C.act_fee}"><p class="mu">Minimum withdrawal</p><input id="s2" value="${C.min}"><p class="mu">Referral bonus</p><input id="s3" value="${C.ref}"><p class="mu">Withdrawal fee (%)</p><input id="s4" value="${C.fee_pct}"><button class="p" data-a="sset">Save</button></div>`;
 A.innerHTML=h;
}
async function resolveName(){const el=$('#ns');el.textContent='Searching…';const no=san,r=await call('resolve',{no,code:sb[1]});if(no!=san)return;if(r.name){swn=r.name;nl=false;$('#wn').value=swn;el.innerHTML='<div class="ok">✓ '+esc(r.name)+'</div>'}else{nl=true;el.textContent=r.error||'Type the account name exactly as it appears on your bank account.'}}
document.addEventListener('input',e=>{const i=e.target.id;if(i=='an'){san=e.target.value.replace(/\D/g,'');swn='';$('#wn').value='';$('#ns').textContent='';if(san.length==10&&sb)resolveName()}if(i=='wn')swn=e.target.value;if(i=='bq'){bq=e.target.value;$('#bl').innerHTML=bankList()}});
document.addEventListener('change',e=>{if(e.target.dataset.a=='pic'&&e.target.files[0])shrink(e.target.files[0],d=>{pend=d;const p=$('#pv');if(p)p.textContent='Screenshot selected ✓'})});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName=='INPUT')return;const a=el.dataset.a,i=el.dataset.i;
 if(a=='reload')return load();
 if(a=='copy')return copy(i);
 if(a=='adm'){adm=true;await loadA();return render()}
 if(a=='exit'){adm=false;return render()}
 if(a=='at'){at=i;await loadA();return render()}
 if(a=='go'){v=i;if(i=='setwallet'&&!sb&&D.user.acct_no){sb=B.find(b=>b[1]==D.user.bank_code)||null;san=D.user.acct_no;swn=D.user.acct_name}return render()}
 if(a=='wt'){w=i;return render()}
 if(a=='banks'){mo=true;bq='';return render()}
 if(a=='closeb'){mo=false;return render()}
 if(a=='pick'){sb=B.find(b=>b[1]==i);mo=false;render();if(san.length==10)resolveName();return}
 if(a=='savew'){if(!sb)return alert('Select your bank first');const r=await run('savewallet',{bank:sb[0],code:sb[1],no:san,name:swn.trim()});if(r&&!r.error){v='wallet';w='w';render()}return}
 if(a=='joined')return run(a);
 if(a=='sendproof'){if(!pend)return alert('Choose your payment screenshot first');const p=pend;pend=null;return run('proofpay',{img:p})}
 if(a=='claim')return run('claim',{tid:+i});
 if(a=='proof'){if(!pend)return alert('Choose a picture first');const p=pend;pend=null;return run('proof',{tid:+i,img:p})}
 if(a=='wdv'){sw=D.wds.find(x=>x.id==i);v='wdone';return render()}
 if(a=='wd'){const r=await run('withdraw',{amt:val('wa')});if(r&&!r.error&&D.wds[0]){sw=D.wds[0];v='wdone';render()}return}
 if(a=='act')return run('a_activate',{uid:i});
 if(a=='prej')return run('a_payrej',{uid:i});
 if(a=='add'){const m=val('m'+i);if(!+m)return;return run('a_add',{uid:i,amt:m})}
 if(a=='addt'){if(!val('tl').trim()||!+val('ta'))return alert('Title and amount required');const p=pend;pend=null;return run('a_addtask',{type:val('tt'),title:val('tl').trim(),link:val('tk').trim(),txt:val('tw'),img:p||'',amt:val('ta')})}
 if(a=='delt')return run('a_deltask',{id:+i});
 if(a=='wa'||a=='wr')return run('a_wdset',{id:+i,ok:a=='wa'});
 if(a=='sa'||a=='sr')return run('a_subset',{id:+i,ok:a=='sa'});
 if(a=='sset')return run('a_cfg',{cfg:{act_fee:+val('s1'),min:+val('s2'),ref:+val('s3'),fee_pct:+val('s4')}});
});
$('#app').innerHTML='<p class="mu" style="padding-top:40px;text-align:center">Loading…</p>';
load();
</script></body></html>
